# Helm overlay for the GKE C6 verification — consumed by DvaraGke.install via `-f`.
#
# The tool creates an opaque Secret (default name `dvara-secrets`) with the
# chart's kebab-case keys (enterprise-license-key, llm-gateway-server-api-key,
# gateway-metrics-api-key, audit-hmac-secret, gateway-encryption-master-password,
# enrolment-shared-secret, spring-datasource-password) — so the chart must READ
# that Secret rather than create its own. Flightdeck's DSN URL/username and the
# image tags are injected by the tool via `--set`. The gateway has no database
# (1.8.2): it enrols with Flightdeck and gets its configuration from it.
secrets:
  create: false
  existingSecret: dvara-secrets

# A volume per gateway pod for its spool, config snapshot and certificate
# (switches the gateway to a StatefulSet).
llmGatewayServer:
  persistence:
    enabled: true

# IP-only smoke (no domain): no Ingress. Readiness is proven by `helm --wait`
# (the chart's readiness probes hit /actuator/health/readiness inside the
# cluster). The tool's external curl is best-effort; enable an Ingress +
# domain for an external smoke.
ingress:
  enabled: false
