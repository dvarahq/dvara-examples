# DVARA Helm chart values — single-tenant deploy
#
# Shape: gateway + flightdeck in ONE namespace, ONE install. The classic
# "we run DVARA for ourselves on our cluster" deploy. No autoscaling, no
# PDB — single-replica each, low resource footprint, suitable for a 2-5
# engineer team running production AI through DVARA on their own k8s.
#
# The gateway has no database (1.8.2). Flightdeck is the only PostgreSQL
# client. The gateway enrols with Flightdeck inside the cluster using a
# shared secret the chart generates, gets its configuration from it, and
# sends its audit and usage records back through a spool on its volume.
# The MCP and A2A planes are served by the gateway on :8080.
#
# Install:
#
#   # 1. Mint the required secrets:
#   export DVARA_ENCRYPTION_MASTER_PASSWORD=$(openssl rand -base64 32)  # ESCROW OFFLINE — loss is unrecoverable
#   export DVARA_AUDIT_HMAC_SECRET=$(openssl rand -base64 32)
#   export DVARA_ACTUATOR_API_KEY=$(openssl rand -base64 32)
#   export DVARA_ACTUATOR_METRICS_API_KEY=$(openssl rand -base64 32)
#   [ "$DVARA_ACTUATOR_API_KEY" != "$DVARA_ACTUATOR_METRICS_API_KEY" ] && echo OK || echo "MUST DIFFER — regenerate"
#   # Optional. Without a licence every feature runs, limited to 3 workspaces
#   # and 100,000 calls a month, for non-production use.
#   export DVARA_LICENSE_KEY=DVARA-…
#
#   # 2. Provision a PostgreSQL 16 instance reachable from the cluster
#   #    (managed cloud, self-hosted, etc.) and put its password in a Secret.
#   #    Only Flightdeck connects to it.
#   kubectl create namespace dvara
#   kubectl -n dvara create secret generic dvara-db --from-literal=password='…'
#   #    Then set the JDBC URL in flightdeck.extraEnv below.
#
#   # 3. Install (chart published at oci://ghcr.io/dvarahq/charts/dvara):
#   helm install dvara oci://ghcr.io/dvarahq/charts/dvara \
#     --version 1.8.2 \
#     --namespace dvara \
#     --values ./values.yaml \
#     --set "secrets.enterpriseLicenseKey=$DVARA_LICENSE_KEY" \
#     --set "secrets.gatewayEncryptionMasterPassword=$DVARA_ENCRYPTION_MASTER_PASSWORD" \
#     --set "secrets.auditHmacSecret=$DVARA_AUDIT_HMAC_SECRET" \
#     --set "secrets.llmGatewayServerApiKey=$DVARA_ACTUATOR_API_KEY" \
#     --set "secrets.gatewayMetricsApiKey=$DVARA_ACTUATOR_METRICS_API_KEY"
#
#   The enrolment secret is generated by the chart on install and kept
#   across upgrades. Set secrets.enrolmentSharedSecret yourself only when
#   you render without a cluster (helm template, Argo CD).
#
# After install:
#   kubectl port-forward -n dvara svc/dvara-flightdeck 8090:8090
#   open http://localhost:8090/  # walk /setup, create your workspace, mint a key
#
# Operational notes:
# - Single-replica gateway. If you need zero-downtime rolling updates, set
#   replicaCount: 2 (the chart already has maxUnavailable: 0).
# - persistence.enabled makes the gateway a StatefulSet with a volume per
#   pod, so a pod killed without its shutdown drain keeps its unsent audit.
# - No HPA. Capacity is the requests/limits below; size for steady-state
#   load.
# - No PDB. Add `llmGatewayServer.pdb.enabled: true` if you run multiple
#   replicas and want a disruption guarantee during voluntary evictions.
# - Mock provider OFF — set `secrets.mockProviderEnabled: "true"` only for
#   smoke / dev. Real provider credentials live in Flightdeck's Credentials
#   page (BYOK, AES-256-GCM at rest, rotatable without restart).

global:
  imageRegistry: ""
  imagePullSecrets: []

llmGatewayServer:
  replicaCount: 1

  image:
    repository: ghcr.io/dvarahq/dvara-gateway
    # Pin in production. Defaults to Chart.appVersion if unset. Use the GA tag.
    tag: ""
    pullPolicy: IfNotPresent

  # A volume per pod for the spool, the config snapshot and the enrolled
  # certificate. Switches the gateway from a Deployment to a StatefulSet.
  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  javaOpts: "-Xms256m -Xmx768m"

  # Probes default to the chart's documented paths
  # (/actuator/health/{liveness,readiness}).

  # Service monitor off by default — flip on if you run Prometheus Operator.
  serviceMonitor:
    enabled: false

flightdeck:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Flightdeck is the only service with a database.
  extraEnv:
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:postgresql://your-db-host:5432/dvara?sslmode=require"
    - name: SPRING_DATASOURCE_USERNAME
      value: "dvara"
    - name: SPRING_DATASOURCE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dvara-db
          key: password

secrets:
  create: true
  # Set at install time via --set (above) or use an existing Secret. The
  # two Bearer keys MUST differ.
  enterpriseLicenseKey: ""
  gatewayEncryptionMasterPassword: ""
  auditHmacSecret: ""
  llmGatewayServerApiKey: ""
  gatewayMetricsApiKey: ""
  # Empty: generated on install and kept across upgrades.
  enrolmentSharedSecret: ""
  # Optional — only if you want OpenAI routing without going through the
  # Console BYOK flow. Leave empty otherwise; configure providers on
  # Flightdeck's Credentials page after install.
  providerKeys:
    openai: ""

ingress:
  enabled: false
  # Uncomment + customize for your cluster:
  # className: nginx
  # baseDomain: dvara.your-company.example
  # # Produces api.dvara.your-company.example + flightdeck.dvara.your-company.example
