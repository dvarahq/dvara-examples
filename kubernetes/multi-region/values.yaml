# DVARA Helm chart values — multi-region deploy
#
# Shape: one DVARA release per geographic region (us-east-1, eu-west-1,
# ap-southeast-1, etc.). Each release runs its own gateways AND its own
# Flightdeck. All the Flightdecks share ONE PostgreSQL database, so every
# region sees the same workspaces, keys, routes and policies.
#
# Why a Flightdeck per region (1.8.2): the gateway has no database. It
# enrols with the Flightdeck in its own release and gets configuration
# from it, and Flightdeck publishes configuration for its own region only.
# The chart gives Flightdeck the same region as the gateways. A region
# with no Flightdeck has gateways that never become ready.
#
# Only Flightdeck crosses regions: a secondary region's Flightdeck reaches
# the database in the primary region, so its pages and writes pay that
# latency. Gateway requests do not. A gateway keeps serving from the
# configuration it holds while its Flightdeck is down, and its records wait
# in its spool.
#
# This values file is **per-region** — install it once per region cluster,
# with a different `llmGatewayServer.region.{id,name}` and a different
# ingress baseDomain. Workspace data-residency rules
# (metadata["data-residency.allowed-regions"]) are enforced on geo-aware
# routes against each provider's region.
#
# Pre-requisites:
#   - One Kubernetes cluster per region
#   - One PostgreSQL 16 database, reachable from every region's Flightdeck
#     (a read replica does not help: Flightdeck writes to it)
#   - The SAME audit HMAC secret and encryption master password in every
#     region — put them in one Secret and copy it to each cluster
#   - Centralized Prometheus federation across regions (optional but
#     recommended for cross-region visibility)
#
# Install (per region; example: us-east-1):
#
#   kubectl -n dvara create secret generic dvara-db --from-literal=password='…'
#   helm install dvara-us-east oci://ghcr.io/dvarahq/charts/dvara \
#     --version 1.8.5 \
#     --namespace dvara \
#     --values ./values.yaml \
#     --set "llmGatewayServer.region.id=us-east-1" \
#     --set "llmGatewayServer.region.name=US East" \
#     --set "secrets.enterpriseLicenseKey=$DVARA_LICENSE_KEY" \
#     --set "secrets.gatewayEncryptionMasterPassword=$DVARA_ENCRYPTION_MASTER_PASSWORD" \
#     --set "secrets.auditHmacSecret=$DVARA_AUDIT_HMAC_SECRET" \
#     --set "secrets.llmGatewayServerApiKey=$DVARA_ACTUATOR_API_KEY" \
#     --set "secrets.gatewayMetricsApiKey=$DVARA_ACTUATOR_METRICS_API_KEY" \
#     --set "ingress.baseDomain=us-east.dvara.yoursaas.com"
#
# Repeat for each region. The licence and the two shared secrets above
# must be the same everywhere; the two actuator keys can be per-region
# (least privilege) or shared (simpler ops). The enrolment secret is
# generated per release and never leaves its region.

global:
  imageRegistry: ""
  imagePullSecrets: []

# ---- gateway: region-local data plane ----
llmGatewayServer:
  replicaCount: 3

  image:
    repository: ghcr.io/dvarahq/dvara-gateway
    tag: ""
    pullPolicy: IfNotPresent

  # SET VIA --set when installing per region. Flightdeck in the same
  # release gets the same value.
  region:
    id: ""
    name: ""

  # A volume per pod for the spool, the config snapshot and the enrolled
  # certificate (switches the gateway to a StatefulSet).
  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

  javaOpts: "-Xms512m -Xmx1536m"

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: gateway-server

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: true
    minAvailable: 2

  serviceMonitor:
    enabled: true
    interval: 15s

# ---- flightdeck: one per region, all on the same database ----
flightdeck:
  replicaCount: 1
  extraEnv:
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:postgresql://your-primary-db-host:5432/dvara?sslmode=require"
    - name: SPRING_DATASOURCE_USERNAME
      value: "dvara"
    - name: SPRING_DATASOURCE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dvara-db
          key: password

secrets:
  create: true
  enterpriseLicenseKey: ""             # SAME licence across regions
  gatewayEncryptionMasterPassword: ""  # SAME password — encrypted provider
                                       # credentials are read in every region
  auditHmacSecret: ""                  # SAME secret — every Flightdeck
                                       # verifies every region's audit
  llmGatewayServerApiKey: ""           # CAN be per-region for LP
  gatewayMetricsApiKey: ""             # CAN be per-region for LP
  enrolmentSharedSecret: ""            # generated per release
  providerKeys: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  baseDomain: ""  # SET per region — e.g. us-east.dvara.yoursaas.com
                  # Each region gets its own hostname so DNS-based geo
                  # routing (Route53 latency policy / Cloudflare load
                  # balancing) can steer customers to the closest region.
