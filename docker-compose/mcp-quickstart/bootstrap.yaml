# Read once by Flightdeck on first boot (DVARA_BOOTSTRAP_FILE). Seeds the quickstart
# workspace. start.sh creates its API key once the workspace has an environment, because
# a key made before then reaches no gateway (since 1.15.0), and writes it to .env.
# The MCP server, the policies and the PII setting are not bootstrap fields; start.sh
# loads them through Flightdeck's config import.
workspaces:
  - id: quickstart
    name: MCP Quickstart
    status: ACTIVE
    region: default

